rules:
  - id: SOP-01
    category: outdoor_activity
    name: Strong Wind Outdoor Activity
    conditions:
      wind_speed_kmh:
        greater_than: 40
      activity:
        in:
          - cycling
          - running
          - hiking
          - walking
    severity: high
    guidance: >
      Avoid outdoor activities in strong winds as they can create
      unsafe conditions.

  - id: SOP-02
    category: outdoor_activity
    name: High UV Outdoor Activity
    conditions:
      uv_index:
        greater_than: 8
      activity:
        in:
          - running
          - cycling
          - hiking
          - outdoor_exercise
    severity: high
    guidance: >
      Avoid outdoor activities during periods of high UV index.
      Consider exercising when the UV index is lower.

  - id: SOP-03
    category: outdoor_activity
    name: Extreme Heat Exercise
    conditions:
      temperature_c:
        greater_than: 40
      activity:
        in:
          - running
          - cycling
          - hiking
          - outdoor_exercise
    severity: high
    guidance: >
      Avoid outdoor exercise during extreme heat because it can
      increase the risk of heat-related illness.

  - id: SOP-04
    category: travel
    name: High Rain Travel Risk
    conditions:
      precipitation_probability:
        greater_than_or_equal: 70
      intent:
        in:
          - travel
          - commute
    severity: medium
    guidance: >
      Consider postponing travel or commuting during periods of
      high precipitation probability.

  - id: SOP-05
    category: travel
    name: Strong Wind Two-Wheeler Travel
    conditions:
      wind_speed_kmh:
        greater_than: 40
      transport:
        in:
          - motorcycle
          - scooter
          - bicycle
    severity: high
    guidance: >
      Strong winds can make two-wheeler travel unsafe.
      Consider delaying the journey or using an alternative
      mode of transport.

  - id: SOP-06
    category: outdoor_activity
    name: Thunderstorm Outdoor Risk
    conditions:
      thunderstorm:
        equals: true
      activity:
        in:
          - picnic
          - hiking
          - camping
          - outdoor_exercise
    severity: high
    guidance: >
      Avoid outdoor activity during thunderstorms and move to
      a safe indoor or sheltered location.

  - id: SOP-07
    category: vulnerable_groups
    name: Extreme Heat for Elderly People
    conditions:
      temperature_c:
        greater_than: 38
      user_group:
        in:
          - elderly
          - senior
    severity: high
    guidance: >
      Avoid prolonged outdoor exposure during extreme heat.
      Stay hydrated and prefer a cool indoor environment.

  - id: SOP-08
    category: vulnerable_groups
    name: Heavy Rain for Children
    conditions:
      precipitation_probability:
        greater_than_or_equal: 80
      user_group:
        in:
          - child
          - children
    severity: medium
    guidance: >
      Consider postponing non-essential outdoor activities
      for children during periods of heavy rain.

  - id: SOP-09
    category: pets
    name: Extreme Heat for Pets
    conditions:
      temperature_c:
        greater_than: 35
      user_group:
        in:
          - pet
          - dog
          - cat
    severity: medium
    guidance: >
      Avoid prolonged outdoor exposure for pets during extreme
      heat and provide access to shade and water.